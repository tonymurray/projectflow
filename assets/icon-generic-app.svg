<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   viewBox="0 0 64 64"
   width="64"
   height="64"
   version="1.1"
   xmlns="http://www.w3.org/2000/svg">
  <!-- Generic "unknown application" fallback icon — used when a real app's theme icon
       can't be resolved (see _theme_icon in projectflow.py). Deliberately a plain window
       shape rather than a gear/cog, since a cog reads as "settings," not "app". -->
  <rect x="4" y="4" width="56" height="56" rx="10" fill="#e4ebf2" stroke="#9aacbd" stroke-width="2"/>
  <rect x="14" y="16" width="36" height="28" rx="4" fill="#ffffff" stroke="#9aacbd" stroke-width="1.5"/>
  <rect x="14" y="16" width="36" height="8" rx="4" fill="#4a86d0"/>
  <rect x="14" y="20" width="36" height="4" fill="#4a86d0"/>
  <circle cx="19" cy="20" r="1.6" fill="#ffffff"/>
  <circle cx="24" cy="20" r="1.6" fill="#ffffff"/>
  <rect x="19" y="30" width="22" height="3" rx="1.5" fill="#c7d3de"/>
  <rect x="19" y="36" width="16" height="3" rx="1.5" fill="#c7d3de"/>
</svg>
