<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { height: 100%; margin: 0; }
  body {
    background: __PF_BG__;
    color: __PF_FG__;
  }
  #editor { height: 100%; }
  .cm-editor { height: 100%; font-family: "DejaVu Sans Mono", "Monospace", monospace; font-size: 13px; }
  .cm-scroller { overflow: auto; }
  __PF_EXTRA_CSS__
</style>
</head>
<body>
<div id="editor"></div>

<script src="./lib/codemirror-bundle.js"></script>
<script>
(function () {
  var CM = window.PFCodeMirror;
  var view = null;
  var dirty = false;
  var syntaxColors = __PF_SYNTAX_JSON__;
  var wrapCompartment = new CM.Compartment();

  var themeExtension = CM.EditorView.theme({
    "&": { backgroundColor: "__PF_BG__", color: "__PF_FG__", height: "100%" },
    ".cm-content": { caretColor: "__PF_FG__" },
    ".cm-gutters": { backgroundColor: "__PF_GUTTER_BG__", color: "__PF_FG_SECONDARY__", border: "none" },
    ".cm-activeLine": { backgroundColor: "__PF_ACTIVE_LINE__" },
    ".cm-activeLineGutter": { backgroundColor: "__PF_ACTIVE_LINE__" },
    ".cm-selectionBackground, ::selection": { backgroundColor: "__PF_SELECTION__ !important" },
  }, { dark: __PF_IS_DARK__ });

  var highlightStyle = CM.HighlightStyle.define([
    { tag: [CM.tags.keyword, CM.tags.controlKeyword, CM.tags.operatorKeyword,
            CM.tags.definitionKeyword, CM.tags.moduleKeyword, CM.tags.self, CM.tags.bool,
            CM.tags.null],
      color: syntaxColors.keyword },
    { tag: [CM.tags.string, CM.tags.special(CM.tags.string), CM.tags.regexp],
      color: syntaxColors.string },
    { tag: [CM.tags.comment, CM.tags.lineComment, CM.tags.blockComment],
      color: syntaxColors.comment, fontStyle: "italic" },
  ]);

  // langMap is keyed by the short language string Python passes in (see
  // _code_editor_language_for() in projectflow.py) rather than by file extension —
  // keeps this shell generic/dumb about extensions, matching how the Muya shell has
  // zero Python-specific knowledge of what "kind" of markdown it's editing.
  var langMap = {
    js: CM.languages.js,
    py: CM.languages.py,
    html: CM.languages.html,
    css: CM.languages.css,
    php: CM.languages.php,
  };

  window.__initCodeEditor = function (content, language, wrapEnabled, viewState) {
    var extensions = [
      CM.basicSetup,
      CM.keymap.of(CM.defaultKeymap),
      // Custom bindings that intentionally override basicSetup's own defaults —
      // wrapped in Prec.highest so they win regardless of extension array order
      // (basicSetup's internal keymaps are default-precedence, so without this
      // the earlier-registered binding for the same key would run first and these
      // would never fire). See CLAUDE.md's Code Editor section for the full list
      // and the conflicts each one deliberately gives up:
      //  - Mod-s: swallows the browser's native "Save Page As" inside the webview —
      //    actual saving is a Python-side action (toolbar Save button / Ctrl+S
      //    handler), there is deliberately no JS->Python push channel for it.
      //  - Mod-g: goto line (was Mod-Alt-g, CM6's default) — frees the more
      //    familiar Ctrl+G for this; find-next/previous remain on F3/Shift-F3 only
      //    (basicSetup's Mod-g/Shift-Mod-g find bindings are shadowed, unused).
      //  - Mod-d: copy current line down (CM6 has no default binding for this —
      //    its own default is Shift-Alt-ArrowDown, still live). Deliberately
      //    shadows basicSetup's Mod-d (multi-cursor "select next occurrence"),
      //    which loses its shortcut entirely — a confirmed tradeoff, not an
      //    oversight.
      //  - Mod-k: cut the current line (nano-style) — see cutLine in entry.js.
      //    Shift-Mod-k (delete line, no clipboard) is unaffected.
      CM.Prec.highest(CM.keymap.of([
        { key: "Mod-s", run: function () { return true; } },
        { key: "Mod-g", run: CM.gotoLine, preventDefault: true },
        { key: "Mod-d", run: CM.copyLineDown, preventDefault: true },
        { key: "Mod-k", run: CM.cutLine, preventDefault: true },
      ])),
      themeExtension,
      CM.syntaxHighlighting(highlightStyle),
      CM.EditorView.updateListener.of(function (u) {
        if (u.docChanged) dirty = true;
      }),
      // Line wrapping lives in its own Compartment so __setCodeEditorWrap() can flip it
      // at runtime without recreating the whole editor (which would lose undo history).
      // Off by default in CM6's basicSetup — long lines just scroll horizontally instead.
      wrapCompartment.of(wrapEnabled ? CM.EditorView.lineWrapping : []),
    ];
    if (langMap[language]) extensions.push(langMap[language]());

    var state = CM.EditorState.create({ doc: content || "", extensions: extensions });
    if (view) view.destroy();
    view = new CM.EditorView({ state: state, parent: document.getElementById("editor") });
    dirty = false;

    // Restore cursor/scroll from before this tab was last switched away from (see
    // __getCodeEditorViewState below) — a fresh EditorState always starts at doc
    // position 0, which otherwise silently drops the caret to the top of the file
    // on every tab switch.
    if (viewState) {
      try {
        var docLen = view.state.doc.length;
        var anchor = Math.min(viewState.anchor || 0, docLen);
        var head = Math.min(viewState.head || 0, docLen);
        view.dispatch({ selection: { anchor: anchor, head: head } });
      } catch (e) {}
      if (viewState.scrollTop) view.scrollDOM.scrollTop = viewState.scrollTop;
    }
  };

  // Captured before switching away from this tab so it can be restored on return —
  // see __initCodeEditor's viewState param above.
  window.__getCodeEditorViewState = function () {
    if (!view) return null;
    var sel = view.state.selection.main;
    return { anchor: sel.anchor, head: sel.head, scrollTop: view.scrollDOM.scrollTop };
  };

  window.__setCodeEditorWrap = function (enabled) {
    if (!view) return;
    view.dispatch({
      effects: wrapCompartment.reconfigure(enabled ? CM.EditorView.lineWrapping : []),
    });
  };

  window.__getCodeEditorContent = function () {
    return view ? view.state.doc.toString() : "";
  };

  window.__codeEditorIsDirty = function () {
    return !!dirty;
  };

  window.__codeEditorClearDirty = function () {
    dirty = false;
  };
})();
</script>
</body>
</html>
