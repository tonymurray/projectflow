<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="./lib/core.css">
<style>
  html, body { height: 100%; margin: 0; }
  body {
    background: __PF_BG__;
    color: __PF_FG__;
  }
  #editor { max-width: 900px; margin: 0 auto; padding: 20px 30px 80px; }
  .ag-editor-container { font-size: 15px; }
  __PF_EXTRA_CSS__
</style>
</head>
<body>
<div id="editor"></div>
<input type="file" id="pf-image-file-input" accept="image/*" style="display:none">

<script src="./lib/assets-shim.js"></script>
<script src="./lib/umd/index.js"></script>
<script>
(function () {
  var M = window['@muyajs/core'];

  M.Muya.use(M.InlineFormatToolbar);
  M.Muya.use(M.EmojiSelector);
  M.Muya.use(M.CodeBlockLanguageSelector);
  M.Muya.use(M.ImageToolBar);
  M.Muya.use(M.ImageResizeBar);
  // "Choose Image" (Select tab) has no OS path to hand back once a file is
  // picked - QtWebEngine's file input, like any browser, never exposes the
  // real filesystem path of a selected file. So instead of a path, this reads
  // the chosen file's bytes and resolves with a base64 data: URL, the exact
  // same embedding ImageEditTool already falls back to for a pasted
  // clipboard image (see pasteImage.ts) - no Python round-trip needed.
  M.Muya.use(M.ImageEditTool, {
    imagePathPicker: function () {
      return new Promise(function (resolve) {
        var input = document.getElementById('pf-image-file-input');
        if (!input) { resolve(''); return; }
        input.value = '';
        var onChange = function () {
          input.removeEventListener('change', onChange);
          var file = input.files && input.files[0];
          if (!file) { resolve(''); return; }
          var reader = new FileReader();
          reader.onload = function (e) { resolve(e.target.result); };
          reader.onerror = function () { resolve(''); };
          reader.readAsDataURL(file);
        };
        input.addEventListener('change', onChange);
        input.click();
      });
    }
  });
  M.Muya.use(M.LinkTools, {
    jumpClick: function (linkInfo) {
      var href = linkInfo && linkInfo.href;
      if (href) window.location.href = 'pfbridge://open-link?url=' + encodeURIComponent(href);
    }
  });
  M.Muya.use(M.ParagraphFrontButton);
  M.Muya.use(M.ParagraphFrontMenu);
  M.Muya.use(M.ParagraphQuickInsertMenu);
  M.Muya.use(M.TableColumnToolbar);
  M.Muya.use(M.TableDragBar);
  M.Muya.use(M.TableRowColumMenu);
  M.Muya.use(M.PreviewToolBar);

  var muya = null;
  var dirty = false;

  window.__initMuya = function (markdown, cursorState) {
    var container = document.getElementById('editor');
    muya = new M.Muya(container, {
      markdown: markdown || '',
      footnote: true,
    });
    muya.init();
    dirty = false;
    muya.on('json-change', function () { dirty = true; });

    // Restore the caret/scroll position from before this tab was last switched away
    // from (see __getMuyaCursorState below) — a fresh Muya instance always seats the
    // caret at the top of the document, which otherwise silently drops your place on
    // every tab switch. getCursorOffset()/setCursorByOffset() round-trip a source-mode
    // {line, ch} pair through the markdown text itself, so it survives the full
    // document rebuild a tab switch does here (same mechanism the desktop's own
    // WYSIWYG<->source-mode toggle uses).
    if (cursorState) {
      try {
        if (cursorState.cursor) muya.setCursorByOffset(cursorState.cursor);
      } catch (e) {}
      if (cursorState.scrollTop) window.scrollTo(0, cursorState.scrollTop);
    }
  };

  window.__getMuyaCursorState = function () {
    if (!muya) return null;
    var cursor = null;
    try { cursor = muya.getCursorOffset(); } catch (e) {}
    return { cursor: cursor, scrollTop: window.scrollY || document.documentElement.scrollTop || 0 };
  };

  window.__getMuyaMarkdown = function () {
    return muya ? muya.getMarkdown() : '';
  };

  window.__setMuyaMarkdown = function (markdown) {
    if (muya) {
      muya.setContent(markdown || '');
      dirty = false;
    }
  };

  window.__muyaIsDirty = function () {
    return !!dirty;
  };

  window.__muyaClearDirty = function () {
    dirty = false;
  };
})();
</script>
</body>
</html>
