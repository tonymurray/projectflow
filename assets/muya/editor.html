<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="./lib/core.css">
<link rel="stylesheet" href="../open-color.css">
<style>
  html, body { height: 100%; margin: 0; }
  body {
    background: __PF_BG__;
    color: __PF_FG__;
  }
  #editor { max-width: 900px; margin: 0 auto; padding: 20px 30px 80px; }
  .ag-editor-container { font-size: 15px; }
  __PF_EXTRA_CSS__
</style>
</head>
<body>
<div id="editor"></div>
<input type="file" id="pf-image-file-input" accept="image/*" style="display:none">

<script src="./lib/assets-shim.js"></script>
<script src="./lib/umd/index.js"></script>
<script>
(function () {
  var M = window['@muyajs/core'];

  M.Muya.use(M.InlineFormatToolbar);
  M.Muya.use(M.EmojiSelector);
  M.Muya.use(M.CodeBlockLanguageSelector);
  M.Muya.use(M.ImageToolBar);
  M.Muya.use(M.ImageResizeBar);
  // "Choose Image" (Select tab) has no OS path to hand back once a file is
  // picked - QtWebEngine's file input, like any browser, never exposes the
  // real filesystem path of a selected file. So instead of a path, this reads
  // the chosen file's bytes and resolves with a base64 data: URL, the exact
  // same embedding ImageEditTool already falls back to for a pasted
  // clipboard image (see pasteImage.ts) - no Python round-trip needed.
  //
  // Inserting a large inline base64 image into Muya's live contenteditable
  // document was confirmed live to hang the editor entirely - this file's own
  // read/encode step is fast, the hang is inside Muya's own internal
  // insert/render code afterward. Confirmed via testing that even a 551KB PNG
  // screenshot (751KB as base64) was enough to hang it - well below what a
  // naive "few MB" guess would have assumed - so the threshold here is
  // deliberately conservative. Anything above it is downscaled/recompressed
  // to a JPEG data URL via canvas before it's ever handed to Muya.
  var PF_IMAGE_MAX_RAW_BYTES = 150 * 1024;
  var PF_IMAGE_MAX_DIMENSION = 1200;

  function pfReadFileAsDataUrl(file, onDone) {
    var reader = new FileReader();
    reader.onload = function (e) { onDone(e.target.result); };
    reader.onerror = function () { onDone(''); };
    reader.readAsDataURL(file);
  }

  function pfDownscaleToDataUrl(file, onDone) {
    pfReadFileAsDataUrl(file, function (rawDataUrl) {
      if (!rawDataUrl) { onDone(''); return; }
      var img = new Image();
      img.onload = function () {
        var scale = Math.min(1, PF_IMAGE_MAX_DIMENSION / Math.max(img.width, img.height));
        var canvas = document.createElement('canvas');
        canvas.width = Math.max(1, Math.round(img.width * scale));
        canvas.height = Math.max(1, Math.round(img.height * scale));
        var ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        onDone(canvas.toDataURL('image/jpeg', 0.85));
      };
      img.onerror = function () { onDone(''); };
      img.src = rawDataUrl;
    });
  }

  M.Muya.use(M.ImageEditTool, {
    imagePathPicker: function () {
      return new Promise(function (resolve) {
        var input = document.getElementById('pf-image-file-input');
        if (!input) { resolve(''); return; }
        input.value = '';
        var onChange = function () {
          input.removeEventListener('change', onChange);
          var file = input.files && input.files[0];
          if (!file) { resolve(''); return; }
          if (file.size <= PF_IMAGE_MAX_RAW_BYTES) {
            pfReadFileAsDataUrl(file, resolve);
          } else {
            pfDownscaleToDataUrl(file, resolve);
          }
        };
        input.addEventListener('change', onChange);
        input.click();
      });
    }
  });
  M.Muya.use(M.LinkTools, {
    jumpClick: function (linkInfo) {
      var href = linkInfo && linkInfo.href;
      if (href) window.location.href = 'pfbridge://open-link?url=' + encodeURIComponent(href);
    }
  });
  M.Muya.use(M.ParagraphFrontButton);
  M.Muya.use(M.ParagraphFrontMenu);
  M.Muya.use(M.ParagraphQuickInsertMenu);
  M.Muya.use(M.TableColumnToolbar);
  M.Muya.use(M.TableDragBar);
  M.Muya.use(M.TableRowColumMenu);
  M.Muya.use(M.PreviewToolBar);

  var muya = null;
  var dirty = false;

  window.__initMuya = function (markdown, cursorState) {
    var container = document.getElementById('editor');
    muya = new M.Muya(container, {
      markdown: markdown || '',
      footnote: true,
    });
    muya.init();
    dirty = false;
    muya.on('json-change', function () { dirty = true; });

    // Restore the caret/scroll position from before this tab was last switched away
    // from (see __getMuyaCursorState below) — a fresh Muya instance always seats the
    // caret at the top of the document, which otherwise silently drops your place on
    // every tab switch. getCursorOffset()/setCursorByOffset() round-trip a source-mode
    // {line, ch} pair through the markdown text itself, so it survives the full
    // document rebuild a tab switch does here (same mechanism the desktop's own
    // WYSIWYG<->source-mode toggle uses).
    if (cursorState) {
      try {
        if (cursorState.cursor) muya.setCursorByOffset(cursorState.cursor);
      } catch (e) {}
      if (cursorState.scrollTop) window.scrollTo(0, cursorState.scrollTop);
    }
  };

  window.__getMuyaCursorState = function () {
    if (!muya) return null;
    var cursor = null;
    try { cursor = muya.getCursorOffset(); } catch (e) {}
    return { cursor: cursor, scrollTop: window.scrollY || document.documentElement.scrollTop || 0 };
  };

  window.__getMuyaMarkdown = function () {
    return muya ? muya.getMarkdown() : '';
  };

  window.__setMuyaMarkdown = function (markdown) {
    if (!muya) {
      console.error('[__setMuyaMarkdown] muya is not initialized -- content NOT applied');
      return false;
    }
    // muya.setContent() unconditionally clears the undo/redo history as a side effect
    // (confirmed in the vendored bundle: Editor.prototype.setContent always calls
    // this.history.clear()) — fine for a fresh load (nothing to lose yet), but this
    // function is also called against a LIVE, already-open session (the To-Do tab's
    // "Add as To-Do" quick-capture writes a new line in and pushes the updated markdown
    // back in here while that tab may still be open; Live View's external-change pickup,
    // see projectflow.py's _muya_live_view_apply_pending_reload()) where wiping history is
    // a real, silent loss of the user's undo stack. muya.replaceContent() computes a diff
    // against the current state and applies it as one recorded, undoable history entry
    // instead (via history.recordRebuild()/suppressRecording()) — same net content, but
    // Ctrl+Z still works afterward, and everything typed before this call is still
    // undoable too.
    //
    // Wrapped in try/catch — confirmed live that replaceContent() can throw a SPURIOUS,
    // unrelated error from the vendored bundle's own internal logging code (a Node-style
    // process.env dev-warning check left in the browser build) AFTER already applying the
    // change underneath — see the 2026-11-02 dictation bug writeup. Harmless; don't let it
    // read as a real failure.
    try {
      muya.replaceContent(markdown || '');
    } catch (e) {
      console.error('[__setMuyaMarkdown] replaceContent threw (usually harmless, see comment above):', e && e.message);
    }
    // Confirmed live (2026-11-11): when this runs while the app's window is occluded
    // (another window covering it, or a different virtual desktop), Chromium's own Page
    // Visibility throttling means the DOM mutation above lands correctly but no new frame
    // gets composited -- confirmed via document.hidden/visibilityState logging below, and
    // confirmed that even switching back to the window afterward did NOT trigger Chromium's
    // normal repaint-on-visible-again behavior (only a full page reload, i.e. clicking
    // Refresh, did). Forcing a resize event is a known, pragmatic trick for unsticking an
    // embedded Chromium view stuck in this state -- it isn't the "correct" visibility-
    // change signal, but it reliably forces a relayout/repaint in practice regardless.
    try {
      window.dispatchEvent(new Event('resize'));
    } catch (e) {}
    dirty = false;
    // Deliberately NOT verified via string-equality against `markdown` (an earlier version
    // of this function, and of __refreshMuyaMarkdown below, did exactly that) --
    // confirmed live (2026-11-11) that Muya's own markdown serialization legitimately
    // normalizes formatting on re-render (table column padding, e.g. "| a | b |" ->
    // "| a   | b   |"; consecutive blank lines collapsed to one), neither of which means
    // the content failed to apply. A strict comparison here produced real, confirmed false
    // "push failed" reports for perfectly successful updates. The only genuine failure
    // signal available is "muya didn't exist at all" (handled above) -- once
    // replaceContent() has actually been called, treat it as applied.
    //
    // Diagnostic-only (does not affect the return value above): confirms the DATA MODEL
    // actually changed, and reports Chromium's own page-visibility state -- added while
    // chasing a report where Live View's status said "picked up" but nothing appeared on
    // screen, alongside a Qt-level "Compositor returned null texture" message (not a JS
    // console line) around the same moment. That combination points at a stale/suppressed
    // REPAINT (likely tied to the window not having focus when the push happens) rather
    // than the content genuinely not updating -- this log is what will confirm or rule
    // that out directly.
    console.log(
      '[__setMuyaMarkdown] resultLen=' + muya.getMarkdown().length +
      ' documentHidden=' + document.hidden + ' visibilityState=' + document.visibilityState
    );
    return true;
  };

  // Used by the Notes "Refresh" button (_notes_refresh_from_disk() in projectflow.py) to
  // reload this session's file from disk into an ALREADY-OPEN session without wiping undo
  // history (muya.replaceContent(), same reasoning as __setMuyaMarkdown above) while
  // restoring the caret as closely as possible. Captures/reseats the cursor internally,
  // synchronously, in one call — no Python round-trip needed, since there's no gap for the
  // cursor to move in between capture and apply the way there would be across two separate
  // runJavaScript calls.
  window.__refreshMuyaMarkdown = function (markdown) {
    if (!muya) return false;
    var prevCursor = null;
    try { prevCursor = muya.getCursorOffset(); } catch (e) {}

    try {
      muya.replaceContent(markdown || '');
    } catch (e) {}
    dirty = false;

    if (prevCursor && prevCursor.anchor) {
      try {
        var lines = (markdown || '').split('\n');
        var clamp = function (pos) {
          var line = Math.min(Math.max(pos.line, 0), lines.length - 1);
          var ch = Math.min(Math.max(pos.ch, 0), lines[line].length);
          return { line: line, ch: ch };
        };
        var anchor = clamp(prevCursor.anchor);
        var focus = clamp(prevCursor.focus || prevCursor.anchor);
        muya.setCursorByOffset({ anchor: anchor, focus: focus });
      } catch (e) {}
    }

    // Deliberately not verified via string-equality against `markdown` -- see
    // __setMuyaMarkdown's comment above for why that's unreliable (Muya's own markdown
    // serialization legitimately normalizes formatting on re-render, e.g. table column
    // padding or collapsing consecutive blank lines, neither of which means the content
    // failed to apply). Once replaceContent() has been called, treat it as applied.
    return true;
  };

  window.__muyaIsDirty = function () {
    return !!dirty;
  };

  window.__muyaClearDirty = function () {
    dirty = false;
  };

  // Splices text in at a given cursor position in a LIVE session — used by the voice
  // dictation feature (start_speechnote_dictation()/_insert_dictated_text()) and the
  // "Insert Clipboard" button (insert_clipboard_at_cursor()), both in projectflow.py.
  // cursorState is the same {cursor: {anchor:{line,ch}, focus:{line,ch}}, scrollTop}
  // shape __getMuyaCursorState() returns, captured fresh right before this call (not
  // cached from earlier) since real time can pass between "where the cursor was" and
  // "now" (several seconds of Dictate listening; or just a moment for a button click),
  // during which the user may have kept editing/moved the caret themselves.
  //
  // DELIBERATELY NOT execCommand('insertText', ...) against the live contenteditable —
  // an earlier version did that, and it's a real, confirmed bug (not just theorized):
  // Muya's own DOM nests MULTIPLE independent contentEditable regions (the outer
  // #editor div is itself contentEditable=true, AND each block's own `.mu-content`
  // span is explicitly contentEditable=true again, nested inside it — confirmed via a
  // live DOM dump). The old code unconditionally called editorEl.focus() on that OUTER
  // div right before execCommand, which resets the caret to the start of the OUTER
  // div's own separate editable scope — discarding whatever position was just set a
  // moment earlier inside a child block's own nested editable span, regardless of
  // whether that position came from a real cursor or the "no cursor" fallback below.
  // Net effect, confirmed live: text always landed at the very top of the note,
  // regardless of the actual cursor position. A live offscreen-QWebEngineView test
  // additionally showed execCommand('insertText', ...) returning true while silently
  // inserting nothing at all when the page lacks real OS-level focus (always the case
  // for a programmatic/headless trigger) — a second, independent fragility with the
  // execCommand approach, on top of the focus-reset bug above.
  //
  // Fix: splice `text` directly into the markdown STRING at the cursor's {line, ch}
  // position (same coordinate system getCursorOffset()/setCursorByOffset() already use
  // — confirmed self-consistent, since __initMuya()'s own tab-switch cursor restore
  // round-trips through exactly this coordinate system) and apply it via
  // muya.replaceContent() — the same diff-based, undo-history-preserving call
  // __setMuyaMarkdown() already uses for live-session edits. No DOM Selection, no
  // focus(), no execCommand — sidesteps the nested-contentEditable interaction
  // entirely. The caret is then explicitly reseated right after the inserted text via
  // setCursorByOffset(), so typing continues naturally from there (matching where a
  // real paste would leave it) rather than wherever replaceContent()'s diff happens to
  // leave Muya's internal selection.
  window.__insertTextAtCursor = function (text, cursorState) {
    if (!muya) return false;
    var markdown = muya.getMarkdown();
    var lines = markdown.split('\n');
    var cursor = cursorState && cursorState.cursor;
    var startLine, startCh, endLine, endCh;

    if (cursor && cursor.anchor && cursor.focus) {
      var a = cursor.anchor, f = cursor.focus;
      // Order anchor/focus into (start <= end) so a real text SELECTION gets replaced
      // by the inserted text, not just inserted at whichever edge happens to be "focus".
      var aFirst = (a.line < f.line) || (a.line === f.line && a.ch <= f.ch);
      var start = aFirst ? a : f;
      var end = aFirst ? f : a;
      // Clamp defensively — the markdown may have changed since cursorState was
      // captured (e.g. autosave/external edit in the gap), so a stale {line, ch}
      // could otherwise point past the end of the current content.
      startLine = Math.min(Math.max(start.line, 0), lines.length - 1);
      endLine = Math.min(Math.max(end.line, 0), lines.length - 1);
      startCh = Math.min(Math.max(start.ch, 0), lines[startLine].length);
      endCh = Math.min(Math.max(end.ch, 0), lines[endLine].length);
    } else {
      // No real cursor at all (e.g. the editor was never clicked into this session) —
      // explicit, predictable fallback: append at the END of the document.
      startLine = endLine = lines.length - 1;
      startCh = endCh = lines[startLine].length;
    }

    var beforeLines = lines.slice(0, startLine);
    var afterLines = lines.slice(endLine + 1);
    var mergedLine = lines[startLine].slice(0, startCh) + text + lines[endLine].slice(endCh);
    var newMarkdown = beforeLines.concat([mergedLine], afterLines).join('\n');

    // Wrapped: confirmed live (offscreen QWebEngineView test) that the vendored Muya
    // bundle's own internal rebuild/diff path can throw a SPURIOUS error from unrelated
    // bundled logging code ("ReferenceError: process is not defined", a Node-style
    // process.env dev-warning check left in a browser build) — AFTER it has already
    // applied the content change underneath. Don't let that abort this function or get
    // mistaken for a real failure; verify success empirically against the document
    // itself afterward instead of trusting replaceContent()'s own throw/return.
    try {
      muya.replaceContent(newMarkdown);
    } catch (e) {}
    dirty = true;

    try {
      var insertedLines = String(text).split('\n');
      var newLine = startLine + insertedLines.length - 1;
      var newCh = insertedLines.length === 1
        ? startCh + text.length
        : insertedLines[insertedLines.length - 1].length;
      var newCursor = { line: newLine, ch: newCh };
      muya.setCursorByOffset({ anchor: newCursor, focus: newCursor });
    } catch (e) {}

    // Compare trailing-newline-insensitively — confirmed live that Muya's own
    // getMarkdown() serialization normalizes the document to always end in exactly one
    // newline, which doesn't necessarily match the literal count our own lines.join('\n')
    // reconstruction produced (e.g. appending after a trailing blank line), causing a
    // strict === to read as "failed" on a perfectly successful insert.
    var normalize = function (s) { return s.replace(/\n+$/, ''); };
    return normalize(muya.getMarkdown()) === normalize(newMarkdown);
  };

  // Muya's own built-in image shortcut (Shift+Ctrl+I, see
  // FORMAT_SHORTCUTS_SHIFT in inlineFormatToolbar) collides with Chromium's
  // reserved "open DevTools" accelerator — QtWebEngine swallows it before it
  // ever reaches this page's own JS, even with DevTools itself disabled, so
  // it silently does nothing (confirmed: no picker, no DevTools either).
  // Ctrl+Alt+I isn't a reserved browser combo, so it reaches here fine.
  // muya.format('image') is the exact same public call the built-in
  // shortcut makes internally (see Muya.format() in muya.ts) — same insert,
  // just reachable via a key combo that actually arrives.
  document.addEventListener('keydown', function (e) {
    if (!muya) return;
    if (e.ctrlKey && e.altKey && !e.shiftKey && (e.key === 'i' || e.key === 'I')) {
      e.preventDefault();
      muya.format('image');
    }
  });
})();
</script>
</body>
</html>
